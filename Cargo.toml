[package]
name = "tuxconsole"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gamepad-first Wayland desktop shell"

[features]
default = []
gui = ["dep:gtk", "dep:gtk4-layer-shell"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"
shlex = "1"
libc = "0.2"
gtk = { package = "gtk4", version = "0.9", optional = true }
gtk4-layer-shell = { version = "0.5", optional = true }

[profile.dev]
debug = 0

[[example]]
name = "window_probe"
required-features = ["gui"]
